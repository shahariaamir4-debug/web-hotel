<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Antix Hotel - Luxury Room Booking (Pay at Hotel)</title>
    <meta name="description" content="Luxury hotel room booking website with pay-on-arrival reservation, interactive room showcase, and guest booking management." />
    <meta property="og:title" content="Antix Hotel - Luxury Room Booking (Pay at Hotel)" />
    <meta property="og:description" content="Luxury hotel room booking website with pay-on-arrival reservation, interactive room showcase, and guest booking management." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Fallback if index.html is opened directly via file:/// protocol instead of localhost
      if (window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(function() {
            var root = document.getElementById('root');
            if (root && (!root.children || root.children.length === 0)) {
              root.innerHTML = `
                <div style="min-height: 100vh; background: #03140e; color: #f8fafc; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px;">
                  <div style="max-width: 540px; width: 100%; background: #06241b; border: 1px solid rgba(16, 185, 129, 0.35); border-radius: 20px; padding: 32px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); text-align: center;">
                    <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(16, 185, 129, 0.15); color: #34d399; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px; font-size: 26px;">
                      🏨
                    </div>
                    <h1 style="font-size: 20px; font-weight: 700; color: #ffffff; margin: 0 0 10px;">Antix Hotel - Localhost Launcher</h1>
                    <p style="font-size: 13px; line-height: 1.6; color: #94a3b8; margin: 0 0 20px;">
                      আধুনিক React ওয়েবসাইট সরাসরি <code style="background: rgba(0,0,0,0.4); padding: 2px 6px; border-radius: 4px; color: #fbbf24;">file:///</code> দিয়ে খুললে ব্রাউজার নিরাপত্তা নিয়মের কারণে সাদা দেখায়। এটি লোকালহোস্টে চলতে তৈরি করা হয়েছে।
                    </p>
                    
                    <div style="background: rgba(0,0,0,0.35); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 14px; padding: 16px; margin-bottom: 22px; text-align: left; font-size: 13px; color: #cbd5e1;">
                      <div style="font-weight: 700; color: #34d399; margin-bottom: 8px;">⚡ ১-ক্লিকে সাইট চালু করার উপায়:</div>
                      <div style="margin-bottom: 6px;">👉 আনজিপ করা ফোল্ডারে থাকা <strong style="color: #6ee7b7;">START-WEBSITE.bat</strong> ফাইলে ডাবল ক্লিক করুন!</div>
                      <div style="color: #94a3b8; font-size: 12px;">(এটি নিজে থেকেই প্যাকেজ ইন্সটল করে ব্রাউজারে সাইট ওপেন করে দিবে)</div>
                    </div>

                    <div style="display: flex; gap: 12px; justify-content: center;">
                      <a href="http://localhost:3000" style="display: inline-block; background: #10b981; color: #ffffff; padding: 11px 22px; border-radius: 10px; font-weight: 700; text-decoration: none; font-size: 13px; box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3);">
                        Open http://localhost:3000 ➔
                      </a>
                    </div>
                  </div>
                </div>
              `;
            }
          }, 300);
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
